services:
  - type: web
    name: claims-app
    runtime: python
    rootDir: claims-app
    buildCommand: pip install -r ../requirements.txt && pip install -r requirements.txt
    startCommand: PYTHONPATH=.. uvicorn app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: NEW_RELIC_LICENSE_KEY
        sync: false
      - key: NEW_RELIC_LOG_API
        value: https://log-api.newrelic.com/log/v1
      - key: APPLICATION_NAME
        value: Claims Service
      - key: ENVIRONMENT
        value: DEV
